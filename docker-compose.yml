# 一键启动：docker compose up -d --build
# 打开 http://localhost:8080/ （测试账号见 README）
services:
  court-mediation:
    build: .
    image: court-mediation:latest
    container_name: court-mediation
    ports:
      - "8080:8080"
    restart: unless-stopped
    # 默认 H2 内存库，免安装；如需 MySQL，取消下行注释并启用 db 服务：
